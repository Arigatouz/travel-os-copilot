<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Pilot · Day Planner</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="planner">
  <div class="bg-grid"></div>
  <div class="bg-blob blob-c"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="split">
          <div class="split-main"><div class="content-pad" id="plannerMain"></div></div>
          <aside class="split-aside" id="planAside"></aside>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  Shell.mount({ route: 'planner', crumb: 'Workspace', title: 'Day Planner' });
  const main = document.getElementById('plannerMain');
  const aside = document.getElementById('planAside');
  let selected = null;
  let mapLoaded = false;

  function t() { return TripStore.get(); }

  function render() {
    const tr = t(), d = TripStore.derived();
    if (!selected && tr.stops[0]) selected = tr.stops[0].id;
    main.innerHTML = `
      <div class="page-head fade-up" style="margin-bottom:20px">
        <div>
          <div class="kicker">// ROUTE TIMELINE</div>
          <h1>Day Planner</h1>
          <p class="lede">Sequence, time, and balance your stops. Reorder to reshape the route — totals and the map update live.</p>
        </div>
        <button class="btn primary" id="optimize">${icon('wand',15)} Optimize sequence</button>
      </div>
      <div class="timeline">
        ${tr.stops.length ? tr.stops.map((s,i)=>stopRow(s,i,tr.stops.length)).join('') : emptyTimeline()}
        ${tr.stops.length?`<div class="tl-end"><span class="tl-dot end">${icon('check',13)}</span><span class="mono muted" style="font-size:11px">DEPART · DAY ${d.totalDays}</span></div>`:''}
      </div>
      ${tr.stops.length?`<button class="btn ghost sm" id="addStopP" style="margin-top:8px">${icon('plus',14)} Add stop</button>`:''}`;
    wire();
    renderAside();
  }

  function stopRow(s, i, total) {
    return `<div class="tl-row ${selected===s.id?'sel':''}" data-id="${s.id}">
      <div class="tl-axis">
        <span class="tl-day mono">D${s.day}</span>
        <span class="tl-dot ${s.status}"></span>
        ${i<total-1?'<span class="tl-line"></span>':''}
      </div>
      <div class="tl-card card hover" data-id="${s.id}">
        <div class="row between">
          <div class="row" style="gap:10px">
            <span class="stop-num mono">${String(i+1).padStart(2,'0')}</span>
            <div>
              <b style="font-size:var(--text-lg)">${s.name}</b>
              <div class="muted mono" style="font-size:10px;letter-spacing:.1em">${icon('pin',10)} ${(s.location||'—').toUpperCase()}</div>
            </div>
          </div>
          <div class="row" style="gap:5px">
            <button class="icon-btn mv-up" data-id="${s.id}" ${i===0?'disabled':''} title="Move earlier">${icon('arrowLeft',14)}</button>
            <button class="icon-btn mv-down" data-id="${s.id}" ${i===total-1?'disabled':''} title="Move later">${icon('arrowRight',14)}</button>
            <button class="icon-btn rm" data-id="${s.id}" title="Remove">${icon('x',14)}</button>
          </div>
        </div>
        <div class="row wrap" style="gap:6px;margin-top:12px">
          <span class="pill ${s.status==='confirmed'?'green':'yellow'}">${s.status}</span>
          <span class="pill"><span style="color:var(--accent)">${icon('clock',10)}</span> ${s.nights} night${s.nights>1?'s':''}</span>
          <span class="pill"><span style="color:var(--accent)">${icon('wallet',10)}</span> ${'$'.repeat(s.costTier)}</span>
          ${(s.activities||[]).length?`<span class="pill"><span style="color:var(--accent)">${icon('star',10)}</span> ${s.activities.length} activities</span>`:''}
        </div>
      </div>
    </div>`;
  }
  function emptyTimeline() {
    return `<div class="empty-state" style="padding:40px 20px">
      <div class="es-ic cyan">${icon('route',28)}</div>
      <h3 style="font-size:var(--text-xl)">No route yet</h3>
      <p class="muted" style="max-width:320px">Add destinations from search or the builder to start sequencing your trip.</p>
      <a class="btn primary sm" href="search.html">${icon('search',14)} Find destinations</a></div>`;
  }

  function wire() {
    main.querySelectorAll('.tl-card').forEach(c => c.onclick = (e) => { if(e.target.closest('.icon-btn')) return; selected = c.dataset.id; render(); });
    main.querySelectorAll('.mv-up').forEach(b => b.onclick = () => { TripStore.moveStop(b.dataset.id,-1,{source:'user'}); render(); });
    main.querySelectorAll('.mv-down').forEach(b => b.onclick = () => { TripStore.moveStop(b.dataset.id,1,{source:'user'}); render(); });
    main.querySelectorAll('.rm').forEach(b => b.onclick = () => { if(selected===b.dataset.id) selected=null; TripStore.removeStop(b.dataset.id); render(); });
    const add = document.getElementById('addStopP'); if (add) add.onclick = () => { const s = TripStore.addStop({name:'New Stop'}); selected=s.id; render(); };
    const opt = document.getElementById('optimize'); if (opt) opt.onclick = optimize;
  }

  function optimize() {
    const tr = t();
    if (tr.stops.length < 3) { toast({kind:'info',title:'Nothing to optimize',msg:'Add at least 3 stops to reorder the route.'}); return; }
    // nearest-neighbour by x,y from first stop
    const stops = tr.stops.slice();
    const order = [stops[0]];
    const rest = stops.slice(1);
    while (rest.length) {
      const last = order[order.length-1];
      let bi=0, bd=Infinity;
      rest.forEach((s,i)=>{ const dd=Math.hypot(s.x-last.x,s.y-last.y); if(dd<bd){bd=dd;bi=i;} });
      order.push(rest.splice(bi,1)[0]);
    }
    TripStore.reorderStops(order.map(s=>s.id),{source:'user'});
    toast({title:'Route optimized',msg:'Stops resequenced to minimize backtracking.'});
    render();
  }

  /* ---------- Map / spatial panel with deferred load ---------- */
  function renderAside() {
    const tr = t();
    const sel = tr.stops.find(s=>s.id===selected);
    aside.innerHTML = `
      <div class="map-wrap" id="mapWrap">${mapLoaded ? mapSVG(tr) : mapSkeleton()}</div>
      <div style="padding:20px">
        ${sel ? selDetail(sel, tr) : `<div class="kicker muted">SELECTED STOP</div>
          <p class="muted" style="margin-top:14px">Select a stop on the timeline to see its details and map position.</p>`}
      </div>`;
    if (!mapLoaded) setTimeout(()=>{ mapLoaded = true; const w=document.getElementById('mapWrap'); if(w) w.innerHTML=mapSVG(t()); }, 1100);
  }
  function mapSkeleton() {
    return `<div class="map-skel">
      <div class="skel" style="position:absolute;inset:0"></div>
      <div class="map-skel-tag mono">${icon('map',16)} LOADING SPATIAL CONTEXT…</div>
    </div>`;
  }
  function mapSVG(tr) {
    const W=360, H=300;
    const pts = tr.stops.map(s=>({x:s.x*W, y:s.y*H, s}));
    const path = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(0)+' '+p.y.toFixed(0)).join(' ');
    return `<div class="map-real scanline">
      <svg viewBox="0 0 ${W} ${H}" class="map-svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="mg" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0V24" fill="none" stroke="rgba(var(--accent-rgb),.12)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="${W}" height="${H}" fill="url(#mg)"/>
        <path d="M30 90 Q90 40 150 70 T280 60 L320 120 Q300 180 240 200 T120 230 Q60 210 40 160 Z"
          fill="rgba(var(--accent-rgb),.05)" stroke="rgba(var(--accent-rgb),.25)" stroke-width="1.2"/>
        ${pts.length>1?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" opacity=".8" class="map-route"/>`:''}
        ${pts.map((p,i)=>`
          <g class="map-node ${p.s.id===selected?'sel':''}" data-id="${p.s.id}" style="cursor:pointer">
            <circle cx="${p.x}" cy="${p.y}" r="${p.s.id===selected?9:6}" fill="${p.s.status==='confirmed'?'var(--cyber-success)':'var(--cyber-warning)'}"/>
            <circle cx="${p.x}" cy="${p.y}" r="14" fill="none" stroke="${p.s.id===selected?'var(--accent)':'transparent'}" stroke-width="1.5" opacity=".7"/>
            <text x="${p.x}" y="${p.y-16}" fill="var(--fg)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">${String(i+1).padStart(2,'0')}</text>
          </g>`).join('')}
      </svg>
      <div class="map-legend mono"><span class="status-dot live"></span> confirmed <span class="status-dot warn" style="margin-left:10px"></span> suggested</div>
      <span class="map-badge mono">${icon('compass',12)} ROUTE PREVIEW · ${pts.length} NODES</span>
    </div>`;
  }
  // delegate node clicks
  aside.addEventListener('click', (e) => {
    const node = e.target.closest('.map-node');
    if (node) { selected = node.dataset.id; render(); }
  });

  function selDetail(s, tr) {
    const idx = tr.stops.findIndex(x=>x.id===s.id);
    return `
      <div class="row between" style="margin-bottom:14px">
        <div class="kicker muted">STOP ${String(idx+1).padStart(2,'0')} DETAILS</div>
        <span class="pill ${s.status==='confirmed'?'green':'yellow'}">${s.status}</span>
      </div>
      <h3 style="font-size:var(--text-2xl)">${s.name}</h3>
      <div class="muted mono" style="font-size:11px;letter-spacing:.1em;margin:4px 0 16px">${icon('pin',11)} ${(s.location||'—').toUpperCase()}</div>
      <div class="sel-meta">
        ${mc('Day',s.day,'calendar')}${mc('Nights',s.nights,'clock')}${mc('Cost','$'.repeat(s.costTier),'wallet')}
      </div>
      <div class="kicker muted" style="margin:20px 0 10px">ACTIVITIES</div>
      <div class="col" style="gap:7px">
        ${(s.activities||[]).map(a=>`<div class="hl-row">${icon('star',12)} ${a}</div>`).join('') || '<p class="muted" style="font-size:13px">No activities yet.</p>'}
      </div>
      <div class="col" style="gap:9px;margin-top:20px">
        <div class="row" style="gap:8px">
          <button class="btn ghost sm grow" id="toggleStatus">${s.status==='confirmed'?icon('undo',13)+' Mark suggested':icon('check',13)+' Confirm stop'}</button>
        </div>
        <a class="btn secondary sm" href="copilot.html?q=${encodeURIComponent('Optimize my stop in '+s.name+' — suggest timing and activities')}" style="width:100%">${icon('sparkles',13)} Ask AI to optimize</a>
      </div>`;
  }
  function mc(label,val,ic){ return `<div class="sel-meta-cell"><span class="muted">${icon(ic,13)}</span>
    <div><div class="mono" style="font-size:9px;letter-spacing:.12em;color:var(--fg-dim)">${label.toUpperCase()}</div><b>${val}</b></div></div>`; }

  aside.addEventListener('click', (e)=>{
    if (e.target.closest('#toggleStatus')) {
      const s = t().stops.find(x=>x.id===selected); if(!s) return;
      TripStore.updateStop(s.id,{status:s.status==='confirmed'?'suggested':'confirmed'});
      render();
    }
  });

  render();
  TripStore.subscribe((s,detail)=>{ if(detail.source==='ai'){ mapLoaded=true; } render(); });
})();
</script>
<style>
.timeline { position: relative; }
.tl-row { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding-bottom: 18px; }
.tl-axis { display: flex; flex-direction: column; align-items: center; position: relative; }
.tl-day { font-size: 10px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--cyber-black);
  background: var(--cyber-warning); box-shadow: 0 0 10px var(--cyber-warning); flex: none; z-index: 1; }
.tl-dot.confirmed { background: var(--cyber-success); box-shadow: 0 0 10px var(--cyber-success); }
.tl-dot.end { width: 22px; height: 22px; display: grid; place-items: center; background: var(--accent); color: var(--cyber-black); box-shadow: 0 0 12px var(--accent); }
.tl-line { width: 2px; flex: 1; background: linear-gradient(var(--border), var(--border)); margin: 4px 0; min-height: 30px; }
.tl-card { padding: 16px; cursor: pointer; }
.tl-row.sel .tl-card { border-color: var(--accent); box-shadow: 0 0 18px rgba(var(--accent-rgb),.2); }
.stop-num { font-size: 13px; color: var(--accent); font-weight: 700; }
.tl-end { display: flex; align-items: center; gap: 14px; padding-left: 17px; }
.tl-end .tl-dot { margin-left: 0; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 13px; text-align: center; }
.es-ic { width: 60px; height: 60px; display: grid; place-items: center; clip-path: var(--clip-notch); background: var(--cyber-dark); border: 1px solid var(--border); color: var(--accent); }
.map-wrap { height: 300px; position: relative; border-bottom: 1px solid var(--border); overflow: hidden; }
.map-skel { position: relative; height: 100%; }
.map-skel-tag { position: absolute; bottom: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: .14em; color: var(--fg-dim); }
.map-real { height: 100%; position: relative; background: var(--cyber-black); }
.map-svg { width: 100%; height: 100%; display: block; }
.map-route { animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.map-legend { position: absolute; bottom: 12px; left: 14px; font-size: 9px; letter-spacing: .1em; color: var(--fg-dim);
  display: flex; align-items: center; gap: 5px; background: rgba(10,10,15,.7); padding: 5px 9px; }
.map-badge { position: absolute; top: 12px; right: 12px; font-size: 9px; letter-spacing: .1em; color: var(--accent);
  display: flex; align-items: center; gap: 5px; background: rgba(10,10,15,.7); padding: 5px 9px; border: 1px solid var(--border-subtle); }
.sel-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
.sel-meta-cell { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--cyber-dark); border: 1px solid var(--border); }
.sel-meta-cell svg { color: var(--accent); }
.hl-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
.hl-row svg { color: var(--cyber-warning); flex: none; }
</style>
</body>
</html>
