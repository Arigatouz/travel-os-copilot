<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Pilot · Dashboard</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="dashboard">
  <div class="bg-grid"></div>
  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="content-pad" id="page"></div>
      </main>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  Shell.mount({ route: 'dashboard', crumb: 'Workspace', title: 'Dashboard' });
  const page = document.getElementById('page');

  const PROMPTS = [
    { icon: 'wand', text: 'Optimize my stop sequence to cut backtracking', tool: 'reorder_itinerary' },
    { icon: 'plus', text: 'Add Osaka as a 2-night food stop after Kyoto', tool: 'add_stop' },
    { icon: 'compass', text: 'Find a coastal day-trip near Kyoto', tool: 'search_destinations' },
    { icon: 'wallet', text: 'Where can I trim the budget without losing highlights?', tool: 'estimate' },
  ];

  function money(n) { return '$' + (n||0).toLocaleString(); }

  function render(flashKeys) {
    const t = TripStore.get(), d = TripStore.derived();
    flashKeys = flashKeys || {};
    page.innerHTML = `
      <div class="page-head fade-up">
        <div>
          <div class="kicker">&gt; _ ACTIVE MISSION</div>
          <h1>Trip Control</h1>
          <p class="lede">One shared plan. You and the co-pilot edit the same trip — every change flows to search, the itinerary, and this overview instantly.</p>
        </div>
        <div class="row">
          <a class="btn ghost" href="search.html">${icon('search',15)} Explore</a>
          <a class="btn primary" href="copilot.html">${icon('sparkles',15)} Ask Co-Pilot</a>
        </div>
      </div>

      <div class="kpi-strip">
        ${kpi('Total days', d.totalDays, '', 'calendar', flashKeys.totalDays)}
        ${kpi('Stops', d.stopCount, d.confirmed + ' confirmed', 'pin', flashKeys.stopCount)}
        ${kpi('Travelers', d.travelerCount, t.style, 'users', flashKeys.travelerCount)}
        ${kpi('Est. cost', money(d.estCost), 'budget ' + money(t.budget), 'wallet', flashKeys.estCost)}
      </div>

      <div class="dash-grid">
        <section class="card pad scanline" style="grid-column: span 2">
          <div class="row between" style="margin-bottom:18px">
            <div>
              <div class="kicker muted">CURRENT TRIP</div>
              <h2 style="font-size:var(--text-2xl);margin-top:6px">${t.name}</h2>
            </div>
            <span class="pill ${d.completion===100?'green':'cyan'}">${d.completion}% complete</span>
          </div>
          ${routeMini(t)}
          <div class="progress"><span style="width:${d.completion}%"></span></div>
          <div class="row between" style="margin-top:18px">
            <div class="row wrap" style="gap:8px">
              <span class="pill cyan">${icon('calendar',11)} ${fmtRange(t.startDate, t.endDate)}</span>
              <span class="pill violet">${t.pace} pace</span>
              <span class="pill ${d.suggested?'yellow':'green'}">${d.suggested} suggested</span>
            </div>
            <a class="btn secondary sm" href="planner.html">Open day planner ${icon('arrowRight',14)}</a>
          </div>
        </section>

        <aside class="card pad" style="--clip-card: var(--clip-notch)">
          <div class="kicker muted" style="margin-bottom:14px">SUGGESTED CO-PILOT PROMPTS</div>
          <div class="prompt-list">
            ${PROMPTS.map(p => `
              <a class="prompt" href="copilot.html?q=${encodeURIComponent(p.text)}">
                <span class="prompt-ic">${icon(p.icon,16)}</span>
                <span class="prompt-tx">${p.text}</span>
                <span class="prompt-tool mono">${p.tool}</span>
              </a>`).join('')}
          </div>
        </aside>

        <section class="card pad">
          <div class="kicker muted" style="margin-bottom:14px">ITINERARY STOPS</div>
          <div class="stop-mini-list">
            ${t.stops.map((s,i) => `
              <div class="stop-mini">
                <span class="stop-idx">${String(i+1).padStart(2,'0')}</span>
                <div class="grow">
                  <b>${s.name}</b>
                  <span class="muted mono" style="font-size:11px"> · Day ${s.day} · ${s.nights}n</span>
                </div>
                <span class="status-dot ${s.status==='confirmed'?'live':'warn'}"></span>
              </div>`).join('') || '<p class="muted">No stops yet.</p>'}
          </div>
          <a class="btn ghost sm" href="builder.html" style="margin-top:14px;width:100%">${icon('plus',14)} Build itinerary</a>
        </section>

        <section class="card pad">
          <div class="kicker muted" style="margin-bottom:14px">RECENT DISCOVERY</div>
          <div class="recent-list">
            ${DESTINATIONS.slice(4,8).map(de => `
              <a class="recent" href="search.html?q=${encodeURIComponent(de.name)}">
                <div class="recent-thumb" style="--h:${de.x*360}deg"></div>
                <div class="grow"><b>${de.name}</b><div class="muted" style="font-size:12px">${de.region}</div></div>
                ${icon('arrowRight',15)}
              </a>`).join('')}
          </div>
        </section>

        <section class="card pad card-grid-tex">
          <div class="kicker muted" style="margin-bottom:6px">CO-PILOT STATUS</div>
          <div class="row" style="gap:10px;margin:14px 0">
            <span class="status-dot live"></span>
            <b class="mono" style="font-size:13px;letter-spacing:.1em">AGENT ONLINE</b>
          </div>
          <p class="muted" style="font-size:13.5px;margin:0 0 16px">6 tools connected to your trip state. The co-pilot can search, add, edit and reorder stops — the same actions you can.</p>
          <div class="tool-chips">
            ${['search_destinations','add_stop','edit_stop','reorder_itinerary','estimate_cost','validate_trip'].map(tl=>`<span class="pill cyan">${tl}</span>`).join('')}
          </div>
        </section>
      </div>`;

    // flash any kpi that changed
    Object.keys(flashKeys).forEach(k => {
      if (flashKeys[k]) { const el = document.querySelector(`[data-kpi="${k}"]`); if (el) el.classList.add('flash'); }
    });
    wireRecentThumbs();
  }

  function kpi(label, val, foot, ic, flash) {
    const key = label.toLowerCase().replace(/[^a-z]/g,'');
    const map = { totaldays:'totalDays', stops:'stopCount', travelers:'travelerCount', estcost:'estCost' };
    return `<div class="kpi ${flash?'flash':''}" data-kpi="${map[key]||key}">
      <div class="row between"><span class="kpi-label">${label}</span><span class="muted">${icon(ic,15)}</span></div>
      <div class="kpi-val">${val}</div>
      <div class="kpi-foot">${foot||'&nbsp;'}</div>
    </div>`;
  }
  function routeMini(t) {
    if (!t.stops.length) return '<p class="muted">Add stops to see your route.</p>';
    return `<div class="route-mini">${t.stops.map((s,i)=>`
      <div class="route-node ${s.status}">
        <span class="rn-dot"></span>
        <b>${s.name}</b>
        <span class="muted mono">${s.nights}n</span>
      </div>
      ${i<t.stops.length-1?'<span class="route-link">'+icon('arrowRight',16)+'</span>':''}`).join('')}</div>`;
  }
  function fmtRange(a,b){ if(!a||!b) return 'Dates TBD';
    const o={month:'short',day:'numeric'}; return new Date(a).toLocaleDateString('en',o)+' – '+new Date(b).toLocaleDateString('en',o); }
  function wireRecentThumbs(){
    document.querySelectorAll('.recent-thumb').forEach(el=>{
      const h = el.style.getPropertyValue('--h');
      el.style.background = `linear-gradient(135deg, hsl(${h} 70% 18%), hsl(${h} 80% 8%))`;
    });
  }

  render();
  TripStore.subscribe((s, detail) => {
    // figure out which KPIs to flash based on change type
    const flash = {};
    if (detail.type && detail.type.startsWith('stop')) { flash.stopCount = true; flash.totalDays = true; flash.estCost = true; }
    if (detail.type === 'trip') { flash.travelerCount = true; flash.estCost = true; flash.totalDays = true; }
    render(flash);
  });
})();
</script>
<style>
.kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
.dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.progress { height: 5px; background: var(--cyber-dark); margin-top: 20px; overflow: hidden; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyber-secondary));
  box-shadow: 0 0 10px var(--accent); transition: width .6s var(--ease); }
.route-mini { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.route-node { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--cyber-dark);
  border: 1px solid var(--border); clip-path: var(--clip-pill); }
.route-node .rn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyber-success); box-shadow: 0 0 8px var(--cyber-success); }
.route-node.suggested .rn-dot { background: var(--cyber-warning); box-shadow: 0 0 8px var(--cyber-warning); }
.route-node b { font-size: 14px; } .route-node .mono { font-size: 11px; }
.route-link { color: var(--accent); display: grid; place-items: center; }
.prompt-list { display: flex; flex-direction: column; gap: 9px; }
.prompt { display: flex; align-items: center; gap: 11px; padding: 12px; background: var(--cyber-dark);
  border: 1px solid var(--border); transition: all var(--dur-base) var(--ease); position: relative; }
.prompt:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(var(--accent-rgb),.18); transform: translateX(3px); }
.prompt-ic { color: var(--accent); flex: none; } .prompt-tx { font-size: 13.5px; flex: 1; line-height: 1.35; }
.prompt-tool { font-size: 9px; color: var(--fg-dim); letter-spacing: .1em; }
.stop-mini-list, .recent-list { display: flex; flex-direction: column; gap: 8px; }
.stop-mini { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--cyber-dark); border: 1px solid var(--border); }
.stop-idx { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 700; }
.recent { display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--cyber-dark);
  border: 1px solid var(--border); color: var(--fg-dim); transition: all var(--dur-base); }
.recent:hover { border-color: var(--accent); color: var(--fg); }
.recent-thumb { width: 46px; height: 46px; flex: none; clip-path: var(--clip-notch); border: 1px solid var(--border); }
.recent b { color: var(--fg); font-size: 14.5px; }
.tool-chips { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 1180px){ .dash-grid{grid-template-columns:1fr} .dash-grid section[style*="span 2"]{grid-column:auto!important} .kpi-strip{grid-template-columns:repeat(2,1fr)} }
</style>
</body>
</html>
