<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Pilot · Itinerary Builder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="builder">
  <div class="bg-grid"></div>
  <div class="bg-blob blob-b"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="split">
          <div class="split-main"><div class="content-pad" id="builderMain"></div></div>
          <aside class="split-aside" id="summaryAside"></aside>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  Shell.mount({ route: 'builder', crumb: 'Workspace', title: 'Itinerary Builder' });
  const main = document.getElementById('builderMain');
  const aside = document.getElementById('summaryAside');

  const STEPS = [
    { id: 'basics', label: 'Basics', icon: 'compass' },
    { id: 'dates', label: 'Dates', icon: 'calendar' },
    { id: 'travelers', label: 'Travelers', icon: 'users' },
    { id: 'stops', label: 'Stops', icon: 'pin' },
    { id: 'activities', label: 'Activities', icon: 'star' },
    { id: 'review', label: 'Review', icon: 'checkCircle' },
  ];
  let step = 0;

  function t() { return TripStore.get(); }

  function stepValid(i) {
    const tr = t();
    switch (STEPS[i].id) {
      case 'basics': return !!tr.name && !!tr.region && !!tr.style;
      case 'dates': return !!tr.startDate && !!tr.endDate && new Date(tr.endDate) >= new Date(tr.startDate);
      case 'travelers': return (Number(tr.travelerCount) || 0) >= 1 && tr.travelers.every(x => x.name);
      case 'stops': return tr.stops.length >= 1 && tr.stops.every(s => s.name);
      case 'activities': return true;
      case 'review': return TripStore.derived().conflicts.filter(c => c.level === 'danger').length === 0;
    }
    return true;
  }

  function renderStepper() {
    return `<div class="stepper">${STEPS.map((s, i) => `
      <button class="step ${i===step?'active':''} ${stepValid(i) && i<step ?'done':''}" data-i="${i}">
        <span class="step-num">${stepValid(i) && i!==step ? icon('check',14) : i+1}</span>
        <span class="step-label">${s.label}</span>
      </button>
      ${i<STEPS.length-1?'<span class="step-bar '+(i<step?'fill':'')+'"></span>':''}`).join('')}</div>`;
  }

  function field(label, inner, opts) {
    opts = opts || {};
    return `<div class="field">
      <label>${label}${opts.req?'<span class="req"> *</span>':''}</label>
      ${inner}
      ${opts.hint?`<span class="field-hint">${opts.hint}</span>`:''}
      ${opts.error?`<span class="field-error">${icon('alert',12)} ${opts.error}</span>`:''}
    </div>`;
  }

  function renderStep() {
    const tr = t();
    const id = STEPS[step].id;
    let body = '';
    if (id === 'basics') {
      body = `
        <div class="grid2">
          ${field('Trip name', `<input class="input" id="f-name" value="${(tr.name||'').replace(/"/g,'&quot;')}" placeholder="e.g. Japan — Neon Circuit">`, {req:true})}
          ${field('Destination region', `<input class="input" id="f-region" value="${(tr.region||'').replace(/"/g,'&quot;')}" placeholder="e.g. Japan">`, {req:true})}
        </div>
        <div class="grid2">
          ${field('Travel style', `<select class="input" id="f-style">${['Urban + Culture','Beach + Relax','Adventure + Outdoors','Food-focused','Mixed'].map(o=>`<option ${tr.style===o?'selected':''}>${o}</option>`).join('')}</select>`, {req:true})}
          ${field('Pace', `<select class="input" id="f-pace">${['Relaxed','Balanced','Packed'].map(o=>`<option ${tr.pace===o?'selected':''}>${o}</option>`).join('')}</select>`)}
        </div>`;
    } else if (id === 'dates') {
      const bad = tr.startDate && tr.endDate && new Date(tr.endDate) < new Date(tr.startDate);
      body = `
        <div class="grid2">
          ${field('Start date', `<input class="input" type="date" id="f-start" value="${tr.startDate||''}">`, {req:true})}
          ${field('End date', `<input class="input ${bad?'error':''}" type="date" id="f-end" value="${tr.endDate||''}">`, {req:true, error: bad?'Start date must come before end date.':''})}
        </div>
        <div class="info-strip">${icon('info',16)} Your trip window is <b>${TripStore.derived().totalDays} days</b>. Stops currently total <b>${TripStore.derived().totalNights} nights</b>.</div>`;
    } else if (id === 'travelers') {
      body = `
        ${field('Number of travelers', `<input class="input" type="number" min="1" max="12" id="f-count" value="${tr.travelerCount}" style="max-width:160px">`, {req:true})}
        <div class="kicker muted" style="margin:20px 0 12px">TRAVELER PROFILES <span class="muted">— dynamic</span></div>
        <div class="repeat-list" id="travelerList">
          ${tr.travelers.map((p,i)=>`
            <div class="repeat-row">
              <span class="repeat-idx">${i+1}</span>
              <input class="input trav-name" data-i="${i}" value="${(p.name||'').replace(/"/g,'&quot;')}" placeholder="Traveler name">
              <select class="input trav-type" data-i="${i}" style="max-width:130px">${['Adult','Child','Senior'].map(o=>`<option ${p.type===o?'selected':''}>${o}</option>`).join('')}</select>
              <input class="input trav-notes" data-i="${i}" value="${(p.notes||'').replace(/"/g,'&quot;')}" placeholder="Notes (diet, seat…)">
              <button class="icon-btn trav-del" data-i="${i}" ${tr.travelers.length<=1?'disabled':''}>${icon('minus',16)}</button>
            </div>`).join('')}
        </div>
        <button class="btn ghost sm" id="addTrav" style="margin-top:12px">${icon('plus',14)} Add traveler</button>`;
    } else if (id === 'stops') {
      body = `
        <div class="kicker muted" style="margin-bottom:12px">TRIP STOPS <span class="muted">— add, remove, reorder</span></div>
        <div class="repeat-list" id="stopList">
          ${tr.stops.map((s,i)=>`
            <div class="stop-edit" data-id="${s.id}">
              <div class="stop-edit-head">
                <span class="repeat-idx">${i+1}</span>
                <input class="input stop-name" data-id="${s.id}" value="${(s.name||'').replace(/"/g,'&quot;')}" placeholder="Stop name">
                <span class="status-dot ${s.status==='confirmed'?'live':'warn'}" title="${s.status}"></span>
                <div class="row" style="gap:4px">
                  <button class="icon-btn stop-up" data-id="${s.id}" ${i===0?'disabled':''}>${icon('arrowLeft',14)}</button>
                  <button class="icon-btn stop-down" data-id="${s.id}" ${i===tr.stops.length-1?'disabled':''}>${icon('arrowRight',14)}</button>
                  <button class="icon-btn stop-del" data-id="${s.id}">${icon('x',14)}</button>
                </div>
              </div>
              <div class="stop-edit-body">
                ${field('Location', `<input class="input stop-loc" data-id="${s.id}" value="${(s.location||'').replace(/"/g,'&quot;')}" placeholder="Region, Country">`)}
                ${field('Nights', `<input class="input stop-nights" type="number" min="1" max="30" data-id="${s.id}" value="${s.nights}">`)}
                ${field('Status', `<select class="input stop-status" data-id="${s.id}">${['suggested','confirmed'].map(o=>`<option ${s.status===o?'selected':''}>${o}</option>`).join('')}</select>`)}
              </div>
            </div>`).join('') || '<p class="muted">No stops yet — add one or import from Search.</p>'}
        </div>
        <div class="row" style="gap:10px;margin-top:14px">
          <button class="btn ghost sm" id="addStop">${icon('plus',14)} Add stop</button>
          <a class="btn ghost sm" href="search.html">${icon('search',14)} Find in search</a>
        </div>`;
    } else if (id === 'activities') {
      body = `
        <p class="muted" style="margin-top:0">Optional notes and priority activities per stop. These flow into the day planner.</p>
        <div class="repeat-list">
          ${tr.stops.map(s=>`
            <div class="card flat" style="padding:16px">
              <div class="row between" style="margin-bottom:10px"><b>${s.name}</b><span class="pill cyan" style="font-size:9px">DAY ${s.day}</span></div>
              ${field('Activities (comma separated)', `<textarea class="input act-input" data-id="${s.id}" rows="2" placeholder="Add activities…">${(s.activities||[]).join(', ')}</textarea>`)}
            </div>`).join('') || '<p class="muted">Add stops first.</p>'}
        </div>`;
    } else if (id === 'review') {
      const d = TripStore.derived();
      body = `
        <div class="review-grid">
          ${reviewCell('Trip', tr.name, tr.style)}
          ${reviewCell('Dates', fmtRange(tr.startDate,tr.endDate), d.totalDays+' days')}
          ${reviewCell('Travelers', d.travelerCount+'', tr.travelers.map(x=>x.name).filter(Boolean).join(', '))}
          ${reviewCell('Stops', d.stopCount+'', tr.stops.map(s=>s.name).join(' → '))}
          ${reviewCell('Est. cost', '$'+d.estCost.toLocaleString(), 'budget $'+(tr.budget||0).toLocaleString())}
          ${reviewCell('Completion', d.completion+'%', d.confirmed+'/'+d.stopCount+' confirmed')}
        </div>
        ${d.conflicts.length ? `<div class="kicker muted" style="margin:22px 0 10px">VALIDATION</div>
          ${d.conflicts.map(c=>`<div class="conflict ${c.level}">${icon(c.level==='danger'?'alert':'info',16)} ${c.msg}</div>`).join('')}`
          : `<div class="conflict ok" style="margin-top:22px">${icon('checkCircle',16)} No conflicts. Plan is valid and ready to save.</div>`}`;
    }

    main.innerHTML = `
      <div class="page-head fade-up" style="margin-bottom:20px">
        <div>
          <div class="kicker">STEP ${String(step+1).padStart(2,'0')} / ${String(STEPS.length).padStart(2,'0')}</div>
          <h1>${STEPS[step].label}</h1>
        </div>
      </div>
      ${renderStepper()}
      <div class="form-card card pad fade-up" style="margin-top:24px">${body}</div>
      <div class="form-nav">
        <button class="btn ghost" id="backBtn" ${step===0?'disabled':''}>${icon('arrowLeft',15)} Back</button>
        <div class="row" style="gap:10px">
          <button class="btn ghost" id="draftBtn">${icon('save',15)} Save draft</button>
          ${step<STEPS.length-1
            ? `<button class="btn primary" id="nextBtn">Next ${icon('arrowRight',15)}</button>`
            : `<a class="btn primary" id="finishBtn" href="review.html">${icon('check',15)} Finish & review</a>`}
        </div>
      </div>`;
    wireStep();
    renderAside();
  }

  function reviewCell(label, big, sub) {
    return `<div class="card flat" style="padding:16px">
      <div class="kicker muted" style="font-size:9px">${label.toUpperCase()}</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;margin:6px 0 2px;color:var(--fg)">${big||'—'}</div>
      <div class="muted" style="font-size:12px;line-height:1.35">${sub||''}</div></div>`;
  }
  function fmtRange(a,b){ if(!a||!b) return 'TBD'; const o={month:'short',day:'numeric'};
    return new Date(a).toLocaleDateString('en',o)+' – '+new Date(b).toLocaleDateString('en',o); }

  function wireStep() {
    document.querySelectorAll('.step').forEach(b => b.onclick = () => { step = +b.dataset.i; renderStep(); });
    const back = document.getElementById('backBtn'); if (back) back.onclick = () => { if (step>0){step--;renderStep();} };
    const next = document.getElementById('nextBtn');
    if (next) next.onclick = () => {
      if (!stepValid(step)) { toast({ kind:'warning', title:'Incomplete step', msg:'Fill the required fields before continuing.' }); flashErrors(); return; }
      step++; renderStep();
    };
    const draft = document.getElementById('draftBtn');
    if (draft) draft.onclick = () => toast({ title:'Draft saved', msg:'Your in-progress trip is saved to the workspace.' });

    bind('#f-name','name'); bind('#f-region','region'); bind('#f-style','style'); bind('#f-pace','pace');
    bind('#f-start','startDate'); bind('#f-end','endDate');
    const fc = document.getElementById('f-count');
    if (fc) fc.onchange = () => { const n=Math.max(1,Math.min(12,+fc.value||1)); syncTravelerCount(n); };

    // travelers
    document.querySelectorAll('.trav-name').forEach(el=>el.onchange=()=>updTrav(+el.dataset.i,{name:el.value}));
    document.querySelectorAll('.trav-type').forEach(el=>el.onchange=()=>updTrav(+el.dataset.i,{type:el.value}));
    document.querySelectorAll('.trav-notes').forEach(el=>el.onchange=()=>updTrav(+el.dataset.i,{notes:el.value}));
    document.querySelectorAll('.trav-del').forEach(el=>el.onclick=()=>{ const tr=t(); tr.travelers.splice(+el.dataset.i,1); tr.travelerCount=tr.travelers.length; TripStore.updateTrip({}); renderStep(); });
    const at = document.getElementById('addTrav'); if (at) at.onclick=()=>{ const tr=t(); tr.travelers.push({id:'t'+Date.now(),name:'',type:'Adult',notes:''}); tr.travelerCount=tr.travelers.length; TripStore.updateTrip({}); renderStep(); };

    // stops
    document.querySelectorAll('.stop-name').forEach(el=>el.onchange=()=>TripStore.updateStop(el.dataset.id,{name:el.value}));
    document.querySelectorAll('.stop-loc').forEach(el=>el.onchange=()=>TripStore.updateStop(el.dataset.id,{location:el.value}));
    document.querySelectorAll('.stop-nights').forEach(el=>el.onchange=()=>TripStore.updateStop(el.dataset.id,{nights:Math.max(1,+el.value||1)}));
    document.querySelectorAll('.stop-status').forEach(el=>el.onchange=()=>TripStore.updateStop(el.dataset.id,{status:el.value}));
    document.querySelectorAll('.stop-up').forEach(el=>el.onclick=()=>{TripStore.moveStop(el.dataset.id,-1);renderStep();});
    document.querySelectorAll('.stop-down').forEach(el=>el.onclick=()=>{TripStore.moveStop(el.dataset.id,1);renderStep();});
    document.querySelectorAll('.stop-del').forEach(el=>el.onclick=()=>{TripStore.removeStop(el.dataset.id);renderStep();});
    const as = document.getElementById('addStop'); if (as) as.onclick=()=>{ TripStore.addStop({name:'New Stop'}); renderStep(); };

    document.querySelectorAll('.act-input').forEach(el=>el.onchange=()=>TripStore.updateStop(el.dataset.id,{activities:el.value.split(',').map(s=>s.trim()).filter(Boolean)}));
  }
  function bind(sel, key) { const el=document.querySelector(sel); if(el) el.onchange=()=>{ const p={}; p[key]=el.value; TripStore.updateTrip(p); }; }
  function updTrav(i, patch){ const tr=t(); Object.assign(tr.travelers[i],patch); TripStore.updateTrip({}); }
  function syncTravelerCount(n){ const tr=t(); while(tr.travelers.length<n) tr.travelers.push({id:'t'+Date.now()+Math.random(),name:'',type:'Adult',notes:''}); tr.travelers=tr.travelers.slice(0,n); tr.travelerCount=n; TripStore.updateTrip({}); renderStep(); }
  function flashErrors(){ document.querySelectorAll('.input').forEach(el=>{ if(!el.value){ el.classList.add('error'); setTimeout(()=>el.classList.remove('error'),1200); } }); }

  function renderAside() {
    const tr = t(), d = TripStore.derived();
    aside.innerHTML = `
      <div style="padding:22px">
        <div class="kicker muted" style="margin-bottom:4px">LIVE SUMMARY</div>
        <div class="row between" style="margin:10px 0 18px"><h3 style="font-size:var(--text-lg)">${tr.name||'Untitled'}</h3>
          <span class="pill ${d.completion===100?'green':'cyan'}">${d.completion}%</span></div>
        <div class="sum-bars">
          ${sumStat('Days', d.totalDays, 'calendar')}
          ${sumStat('Stops', d.stopCount, 'pin')}
          ${sumStat('Travelers', d.travelerCount, 'users')}
          ${sumStat('Est. cost', '$'+d.estCost.toLocaleString(), 'wallet')}
        </div>
        <div class="progress" style="margin:18px 0"><span style="width:${d.completion}%"></span></div>
        <div class="kicker muted" style="margin:8px 0 10px">STEP STATUS</div>
        <div class="col" style="gap:7px">
          ${STEPS.map((s,i)=>`<div class="step-status-row ${i===step?'cur':''}">
            <span class="status-dot ${stepValid(i)?'live':'idle'}"></span>
            <span class="${stepValid(i)?'':'muted'}">${s.label}</span>
            ${i===step?'<span class="pill cyan" style="font-size:8px;margin-left:auto">EDITING</span>':''}</div>`).join('')}
        </div>
        ${d.conflicts.length?`<div class="divider"></div>
          <div class="kicker muted" style="margin-bottom:8px">${icon('alert',12)} ${d.conflicts.length} NOTICE${d.conflicts.length>1?'S':''}</div>
          ${d.conflicts.map(c=>`<div class="conflict ${c.level}" style="font-size:12px;padding:9px 11px;margin-bottom:7px">${c.msg}</div>`).join('')}`:''}
      </div>`;
  }
  function sumStat(label, val, ic){
    return `<div class="sum-stat"><span class="muted">${icon(ic,14)}</span>
      <div class="col" style="gap:1px"><span class="mono" style="font-size:9px;letter-spacing:.12em;color:var(--fg-dim)">${label.toUpperCase()}</span>
      <b style="font-size:16px">${val}</b></div></div>`;
  }

  renderStep();
  TripStore.subscribe(() => { renderAside(); });
})();
</script>
<style>
.stepper { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: var(--cyber-dark);
  border: 1px solid var(--border); cursor: pointer; clip-path: var(--clip-pill); transition: all var(--dur-base); }
.step:hover { border-color: var(--border-subtle); }
.step.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb),.2); background: rgba(var(--accent-rgb),.08); }
.step-num { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--border);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--fg-dim); flex: none; }
.step.active .step-num { background: var(--accent); color: var(--cyber-black); }
.step.done .step-num { background: var(--cyber-success); color: var(--cyber-black); }
.step-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.step.active .step-label { color: var(--accent); }
.step-bar { width: 18px; height: 2px; background: var(--border); flex: none; }
.step-bar.fill { background: var(--cyber-success); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid2:last-child { margin-bottom: 0; }
.form-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
.info-strip { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06); border: 1px solid var(--border-subtle); font-size: 13.5px; color: var(--fg); }
.info-strip svg { color: var(--accent); flex: none; }
.repeat-list { display: flex; flex-direction: column; gap: 12px; }
.repeat-row { display: grid; grid-template-columns: 30px 1fr 130px 1fr 38px; gap: 10px; align-items: center; }
.repeat-idx { width: 28px; height: 28px; display: grid; place-items: center; clip-path: var(--clip-notch);
  background: var(--cyber-dark); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); }
.stop-edit { background: var(--cyber-dark); border: 1px solid var(--border); padding: 14px; clip-path: var(--clip-notch); }
.stop-edit-head { display: flex; align-items: center; gap: 10px; }
.stop-edit-head .stop-name { flex: 1; }
.stop-edit-body { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 12px; margin-top: 12px; }
.review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.conflict { display: flex; align-items: flex-start; gap: 9px; padding: 12px 14px; font-size: 13.5px;
  border: 1px solid var(--border); border-left-width: 3px; }
.conflict svg { flex: none; margin-top: 1px; }
.conflict.danger { border-left-color: var(--cyber-danger); color: var(--cyber-danger); background: rgba(255,42,109,.06); }
.conflict.warning { border-left-color: var(--cyber-warning); color: var(--cyber-warning); background: rgba(252,238,10,.05); }
.conflict.ok, .conflict { border-left-color: var(--cyber-success); }
.conflict.ok { color: var(--cyber-success); background: rgba(5,255,161,.06); }
.sum-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum-stat { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--cyber-dark); border: 1px solid var(--border); }
.sum-stat svg { color: var(--accent); }
.progress { height: 5px; background: var(--cyber-dark); overflow: hidden; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyber-secondary)); box-shadow: 0 0 10px var(--accent); transition: width .5s var(--ease); }
.step-status-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 5px 0; }
.step-status-row.cur { color: var(--accent); }
@media (max-width: 1320px){ .review-grid{grid-template-columns:1fr 1fr} .stop-edit-body{grid-template-columns:1fr} .repeat-row{grid-template-columns:24px 1fr 1fr;grid-auto-flow:row} }
</style>
</body>
</html>
