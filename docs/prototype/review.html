<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Pilot · Review</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="review">
  <div class="bg-grid"></div>
  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="content-pad" id="reviewMain" style="max-width:1100px"></div>
      </main>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  Shell.mount({ route: 'review', crumb: 'Finalize', title: 'Trip Review' });
  const main = document.getElementById('reviewMain');

  function fmt(d){ return d? new Date(d).toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}) : 'TBD'; }
  function money(n){ return '$'+(n||0).toLocaleString(); }

  function render(flash) {
    const tr = TripStore.get(), d = TripStore.derived();
    const tierRate = {1:120,2:210,3:340,4:520};
    const pax = d.travelerCount;
    const lodging = tr.stops.reduce((s,x)=>s+(tierRate[x.costTier]||200)*(x.nights||1),0);
    const breakdown = [
      { label:'Flights & transfers', val: Math.round(pax*850), color:'var(--cyber-primary)' },
      { label:'Lodging', val: Math.round(lodging*pax*0.42), color:'var(--cyber-accent)' },
      { label:'Activities & food', val: Math.round(lodging*pax*0.18), color:'var(--cyber-secondary)' },
    ];
    const total = breakdown.reduce((s,b)=>s+b.val,0);

    main.innerHTML = `
      <div class="page-head fade-up">
        <div>
          <div class="kicker">v1.0 · READY TO FINALIZE</div>
          <h1>${tr.name||'Untitled Trip'}</h1>
          <p class="lede">${tr.style} · ${tr.pace} pace · ${fmt(tr.startDate)} → ${fmt(tr.endDate)}</p>
        </div>
        <span class="pill ${d.completion===100?'green':'cyan'}" style="font-size:11px">${d.completion}% COMPLETE</span>
      </div>

      <div class="kpi-strip">
        ${kpi('Total days', d.totalDays,'','calendar',flash)}
        ${kpi('Stops', d.stopCount, d.confirmed+' confirmed','pin',flash)}
        ${kpi('Travelers', d.travelerCount, tr.travelers.map(x=>x.name).filter(Boolean)[0]||'','users',flash)}
        ${kpi('Est. cost', money(d.estCost),'budget '+money(tr.budget),'wallet',flash)}
      </div>

      ${d.conflicts.length ? `<div class="card pad" style="margin-bottom:20px;border-left:3px solid var(--cyber-warning)">
        <div class="kicker" style="color:var(--cyber-warning);margin-bottom:12px">${icon('alert',13)} ${d.conflicts.length} ITEM${d.conflicts.length>1?'S':''} NEED ATTENTION</div>
        ${d.conflicts.map(c=>`<div class="conflict ${c.level}">${icon(c.level==='danger'?'alert':'info',15)} ${c.msg}</div>`).join('')}
      </div>` : `<div class="card pad" style="margin-bottom:20px;border-left:3px solid var(--cyber-success)">
        <div class="row" style="gap:10px"><span style="color:var(--cyber-success)">${icon('checkCircle',20)}</span>
        <div><b style="color:var(--cyber-success)">Plan validated</b><div class="muted" style="font-size:13px">No conflicts. Every stop is confirmed and dates are consistent.</div></div></div>
      </div>`}

      <div class="rev-grid">
        <section class="card pad" style="grid-column:span 2">
          <div class="row between" style="margin-bottom:18px">
            <div class="kicker muted">ITINERARY · ${tr.stops.map(s=>s.name).join(' → ')}</div>
            <a class="btn ghost sm" href="planner.html">${icon('route',13)} Edit route</a>
          </div>
          <div class="rev-stops">
            ${tr.stops.map((s,i)=>`
              <div class="rev-stop">
                <div class="rev-stop-num mono">${String(i+1).padStart(2,'0')}</div>
                <div class="grow">
                  <div class="row between"><b style="font-size:var(--text-lg)">${s.name}</b>
                    <span class="pill ${s.status==='confirmed'?'green':'yellow'}">${s.status}</span></div>
                  <div class="muted mono" style="font-size:10px;letter-spacing:.1em;margin:2px 0 8px">DAY ${s.day} · ${s.nights} NIGHTS · ${(s.location||'').toUpperCase()}</div>
                  <div class="row wrap" style="gap:5px">${(s.activities||[]).slice(0,4).map(a=>`<span class="pill" style="font-size:9px">${a}</span>`).join('')||'<span class="muted" style="font-size:12px">No activities planned</span>'}</div>
                </div>
              </div>`).join('') || '<p class="muted">No stops added.</p>'}
          </div>
        </section>

        <section class="card pad">
          <div class="kicker muted" style="margin-bottom:16px">${icon('wallet',12)} BUDGET BREAKDOWN</div>
          <div class="budget-total"><span class="mono muted">ESTIMATED TOTAL</span><div class="bt-val">${money(total)}</div>
            <span class="muted mono" style="font-size:11px">${money(Math.round(total/pax))} / traveler</span></div>
          <div class="budget-bars">
            ${breakdown.map(b=>`
              <div class="bbar">
                <div class="row between" style="font-size:13px"><span>${b.label}</span><b>${money(b.val)}</b></div>
                <div class="bbar-track"><span style="width:${(b.val/total*100).toFixed(0)}%;background:${b.color};box-shadow:0 0 8px ${b.color}"></span></div>
              </div>`).join('')}
          </div>
          ${tr.budget?`<div class="budget-vs ${total>tr.budget?'over':'under'}">${total>tr.budget?icon('alert',13)+' '+money(total-tr.budget)+' over budget':icon('check',13)+' '+money(tr.budget-total)+' under budget'}</div>`:''}
        </section>

        <section class="card pad">
          <div class="kicker muted" style="margin-bottom:16px">${icon('users',12)} TRAVELERS · ${d.travelerCount}</div>
          <div class="col" style="gap:9px">
            ${tr.travelers.map(p=>`<div class="trav-row">
              <div class="avatar" style="width:32px;height:32px;font-size:12px">${(p.name||'T').slice(0,2).toUpperCase()}</div>
              <div class="grow"><b>${p.name||'Unnamed'}</b><div class="muted" style="font-size:12px">${p.type}${p.notes?' · '+p.notes:''}</div></div>
            </div>`).join('')}
          </div>
        </section>

        <section class="card pad">
          <div class="kicker muted" style="margin-bottom:16px">${icon('calendar',12)} TRIP META</div>
          <div class="meta-list">
            ${ml('Dates', fmt(tr.startDate)+' → '+fmt(tr.endDate))}
            ${ml('Region', tr.region||'—')}
            ${ml('Style', tr.style)}
            ${ml('Pace', tr.pace)}
            ${ml('Nights total', d.totalNights+' / '+d.totalDays+' days')}
            ${ml('Confirmed', d.confirmed+' of '+d.stopCount+' stops')}
          </div>
        </section>
      </div>

      <div class="finalize-bar card">
        <div>
          <div class="kicker muted">FINALIZE</div>
          <b style="font-size:var(--text-lg)">${d.completion===100?'Everything checks out — ready to publish.':'You can publish now or resolve the open items first.'}</b>
        </div>
        <div class="row" style="gap:10px">
          <button class="btn ghost" id="exportBtn">${icon('download',15)} Export</button>
          <button class="btn secondary" id="resetBtn">${icon('refresh',15)} Reset demo</button>
          <button class="btn primary" id="publishBtn">${icon('check',15)} Publish trip</button>
        </div>
      </div>`;

    if (flash) main.querySelectorAll('.kpi').forEach(k=>k.classList.add('flash'));
    document.getElementById('publishBtn').onclick = () => toast({title:'Trip published',msg:`${tr.name} is live and shareable.`});
    document.getElementById('exportBtn').onclick = () => toast({kind:'info',title:'Export started',msg:'Generating a PDF itinerary…'});
    document.getElementById('resetBtn').onclick = () => { TripStore.reset(); toast({kind:'info',title:'Demo reset',msg:'Trip restored to the seed itinerary.'}); };
  }

  function kpi(label,val,foot,ic){ return `<div class="kpi">
    <div class="row between"><span class="kpi-label">${label}</span><span class="muted">${icon(ic,15)}</span></div>
    <div class="kpi-val">${val}</div><div class="kpi-foot">${foot||'&nbsp;'}</div></div>`; }
  function ml(label,val){ return `<div class="ml-row"><span class="muted mono" style="font-size:10px;letter-spacing:.1em">${label.toUpperCase()}</span><b>${val}</b></div>`; }

  render();
  TripStore.subscribe(()=>render(true));
})();
</script>
<style>
.kpi-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
.rev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.conflict { display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 8px; border-left: 3px solid var(--border); background: var(--cyber-dark); }
.conflict:last-child { margin-bottom: 0; }
.conflict.danger { border-left-color: var(--cyber-danger); color: var(--cyber-danger); }
.conflict.warning { border-left-color: var(--cyber-warning); color: var(--cyber-warning); }
.conflict svg { flex: none; margin-top: 1px; }
.rev-stops { display: flex; flex-direction: column; gap: 12px; }
.rev-stop { display: flex; gap: 14px; padding: 14px; background: var(--cyber-dark); border: 1px solid var(--border); clip-path: var(--clip-notch); }
.rev-stop-num { width: 34px; height: 34px; flex: none; display: grid; place-items: center; clip-path: var(--clip-notch);
  background: rgba(var(--accent-rgb),.1); border: 1px solid var(--border-subtle); color: var(--accent); font-weight: 700; font-size: 13px; }
.budget-total { padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.bt-val { font-family: var(--font-display); font-size: 2.2rem; color: var(--fg); line-height: 1; margin: 4px 0; }
.budget-bars { display: flex; flex-direction: column; gap: 13px; }
.bbar-track { height: 6px; background: var(--cyber-black); margin-top: 6px; overflow: hidden; }
.bbar-track span { display: block; height: 100%; transition: width .6s var(--ease); }
.budget-vs { margin-top: 16px; padding: 10px 13px; font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; gap: 7px; clip-path: var(--clip-pill); }
.budget-vs.under { background: rgba(5,255,161,.08); color: var(--cyber-success); }
.budget-vs.over { background: rgba(255,42,109,.08); color: var(--cyber-danger); }
.trav-row { display: flex; align-items: center; gap: 11px; padding: 9px 11px; background: var(--cyber-dark); border: 1px solid var(--border); }
.meta-list { display: flex; flex-direction: column; }
.ml-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.ml-row:last-child { border-bottom: none; }
.finalize-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 24px; margin-top: 20px;
  clip-path: var(--clip-card); border-color: var(--border-subtle); background: linear-gradient(120deg, var(--cyber-card), rgba(var(--accent-rgb),.04)); flex-wrap: wrap; }
@media (max-width: 980px){ .rev-grid{grid-template-columns:1fr} .rev-grid section[style*="span 2"]{grid-column:auto!important} .kpi-strip{grid-template-columns:repeat(2,1fr)} }
</style>
</body>
</html>
