<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Pilot · AI Workspace</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="copilot">
  <div class="bg-grid"></div>
  <div class="bg-blob blob-a"></div>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content" style="overflow:hidden">
        <div class="split">
          <div class="split-main copilot-main">
            <div class="chat-scroll" id="chat"></div>
            <div class="composer">
              <div class="suggest-row" id="suggestRow"></div>
              <div class="composer-box">
                <textarea id="prompt" rows="1" placeholder="Ask the co-pilot to search, add stops, reorder, or estimate cost…"></textarea>
                <button class="btn primary send-btn" id="send">${''}</button>
              </div>
              <div class="composer-foot mono">
                <span><span class="status-dot live"></span> AGENT ONLINE · 6 TOOLS</span>
                <span id="modelTag">SHARED TRIP STATE · LIVE</span>
              </div>
            </div>
          </div>
          <aside class="split-aside" id="activityAside"></aside>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  Shell.mount({ route: 'copilot', crumb: 'Intelligence', title: 'AI Co-Pilot' });
  const chat = document.getElementById('chat');
  const aside = document.getElementById('activityAside');
  const input = document.getElementById('prompt');
  document.getElementById('send').innerHTML = icon('send',16);

  const SUGGEST = [
    'Optimize my stop sequence',
    'Add Osaka after Kyoto',
    'Find a day-trip near Kyoto',
    'Where can I trim the budget?',
  ];
  const toolEvents = [];
  let busy = false;

  function renderSuggest() {
    document.getElementById('suggestRow').innerHTML = SUGGEST.map(s =>
      `<button class="suggest-chip" data-q="${s.replace(/"/g,'&quot;')}">${icon('sparkles',12)} ${s}</button>`).join('');
    document.querySelectorAll('.suggest-chip').forEach(b => b.onclick = () => { input.value = b.dataset.q; send(); });
  }

  /* ---------- message rendering ---------- */
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }
  function addUser(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="msg-av user-av">AK</div>`;
    chat.appendChild(el); scrollDown();
  }
  function addAI() {
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.innerHTML = `<div class="msg-av ai-av">${icon('sparkles',16)}</div><div class="ai-body"></div>`;
    chat.appendChild(el); scrollDown();
    return el.querySelector('.ai-body');
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function typeText(container, text, cb) {
    const p = document.createElement('p'); p.className = 'ai-text';
    container.appendChild(p);
    let i = 0;
    (function tick(){
      if (i <= text.length) { p.innerHTML = escapeHtml(text.slice(0,i)) + '<span class="caret"></span>'; i += 2; scrollDown(); setTimeout(tick, 12); }
      else { p.innerHTML = escapeHtml(text); cb && cb(); }
    })();
  }

  function toolCall(container, name, argText, cb) {
    const el = document.createElement('div');
    el.className = 'tool-call running';
    el.innerHTML = `<div class="tc-head"><span class="tc-spin">${icon('refresh',13)}</span>
      <span class="tc-name mono">${name}</span><span class="tc-args mono">${argText||''}</span>
      <span class="tc-state mono">RUNNING</span></div>`;
    container.appendChild(el); scrollDown();
    logEvent(name, 'running', argText);
    setTimeout(() => {
      el.classList.remove('running'); el.classList.add('done');
      el.querySelector('.tc-spin').innerHTML = icon('check',13);
      el.querySelector('.tc-state').textContent = 'DONE';
      logEvent(name, 'done', argText);
      cb && cb(el);
    }, 720);
  }

  function changeCard(container, opts) {
    const snap = TripStore.snapshot();
    const el = document.createElement('div');
    el.className = 'change-card';
    el.innerHTML = `
      <div class="cc-head"><span class="kicker">${icon('bolt',12)} ${opts.title}</span>
        <span class="pill solid" style="font-size:8px">APPLIED</span></div>
      <div class="cc-diff">${opts.diff.map(d=>`<div class="diff-row ${d.t}"><span>${d.t==='add'?'+':d.t==='rm'?'−':'~'}</span> ${d.text}</div>`).join('')}</div>
      <div class="cc-actions">
        <button class="btn ghost sm cc-undo">${icon('undo',13)} Undo</button>
        <a class="btn secondary sm" href="${opts.href||'planner.html'}">${icon('eye',13)} Review changes</a>
      </div>`;
    container.appendChild(el); scrollDown();
    el.querySelector('.cc-undo').onclick = () => {
      TripStore.replace(snap, {source:'user'});
      el.querySelector('.cc-actions').innerHTML = `<span class="mono muted" style="font-size:11px">${icon('undo',12)} CHANGE REVERTED</span>`;
      el.querySelector('.pill').textContent = 'REVERTED'; el.querySelector('.pill').classList.remove('solid');
      toast({kind:'info',title:'Reverted',msg:'The AI change was undone.'});
    };
  }

  function suggestion(container, text, href) {
    const el = document.createElement('div');
    el.className = 'next-suggest';
    el.innerHTML = `${icon('arrowRight',13)} <a href="${href}">${text}</a>`;
    container.appendChild(el); scrollDown();
  }

  /* ---------- activity aside ---------- */
  function logEvent(name, status, args) {
    toolEvents.unshift({ name, status, args, ts: Date.now() });
    if (toolEvents.length > 14) toolEvents.pop();
    renderAside();
  }
  function renderAside() {
    const tr = TripStore.get(), d = TripStore.derived();
    aside.innerHTML = `
      <div style="padding:20px">
        <div class="kicker muted" style="margin-bottom:12px">${icon('terminal',12)} TOOL ACTIVITY</div>
        <div class="activity-log">
          ${toolEvents.length ? toolEvents.map(e=>`
            <div class="act-row ${e.status}">
              <span class="act-dot"></span>
              <span class="mono act-name">${e.name}</span>
              <span class="mono act-st">${e.status==='running'?'··':icon('check',11)}</span>
            </div>`).join('') : '<p class="muted" style="font-size:13px">No tool calls yet. Ask the co-pilot to do something.</p>'}
        </div>
        <div class="divider"></div>
        <div class="kicker muted" style="margin-bottom:12px">${icon('layers',12)} SHARED TRIP STATE</div>
        <div class="ss-grid">
          ${ssCell('Days', d.totalDays)}${ssCell('Stops', d.stopCount)}
          ${ssCell('Travelers', d.travelerCount)}${ssCell('Est. cost', '$'+(d.estCost/1000).toFixed(1)+'k')}
        </div>
        <div class="kicker muted" style="margin:18px 0 10px">CURRENT ROUTE</div>
        <div class="col" style="gap:6px">
          ${tr.stops.map((s,i)=>`<div class="ss-stop"><span class="mono" style="color:var(--accent)">${String(i+1).padStart(2,'0')}</span>
            <span class="grow">${s.name}</span><span class="status-dot ${s.status==='confirmed'?'live':'warn'}"></span></div>`).join('') || '<p class="muted" style="font-size:13px">No stops.</p>'}
        </div>
        <div class="ss-note mono">${icon('info',12)} AI uses the same tools you do. Every change is reversible.</div>
      </div>`;
  }
  function ssCell(l,v){ return `<div class="ss-cell"><span class="mono" style="font-size:9px;letter-spacing:.12em;color:var(--fg-dim)">${l.toUpperCase()}</span><b>${v}</b></div>`; }
  function ssStop(){}

  /* ---------- intent engine (scripted) ---------- */
  function matchIntent(qRaw) {
    const q = qRaw.toLowerCase();
    if (/(optimi[sz]e|reorder|sequence|rebalance|backtrack)/.test(q)) return { type:'optimize' };
    const addMatch = DESTINATIONS.find(d => q.includes('add') && q.includes(d.name.toLowerCase()));
    if (addMatch) return { type:'add', dest: addMatch };
    if (/(find|search|day.?trip|nearby|coastal|suggest).*(near|trip|around)?/.test(q) || /^(find|search)/.test(q)) return { type:'search', q: qRaw };
    if (/(budget|cost|trim|cheaper|save money|expensive)/.test(q)) return { type:'budget' };
    const aboutMatch = DESTINATIONS.find(d => q.includes(d.name.toLowerCase()));
    if (aboutMatch && /(tell|about|fit|worth|should)/.test(q)) return { type:'about', dest: aboutMatch };
    return { type:'fallback', q: qRaw };
  }

  function run(intent, body) {
    if (intent.type === 'optimize') return runOptimize(body);
    if (intent.type === 'add') return runAdd(intent.dest, body);
    if (intent.type === 'search') return runSearch(intent.q, body);
    if (intent.type === 'budget') return runBudget(body);
    if (intent.type === 'about') return runAbout(intent.dest, body);
    return runFallback(intent.q, body);
  }

  function runOptimize(body) {
    typeText(body, 'Let me analyze your route geometry and resequence to cut backtracking. Reading the current itinerary…', () => {
      toolCall(body, 'reorder_itinerary', '{ strategy: "nearest-neighbour" }', () => {
        const tr = TripStore.get(); const before = tr.stops.map(s=>s.name);
        const stops = tr.stops.slice(); const order=[stops[0]]; const rest=stops.slice(1);
        while(rest.length){ const last=order[order.length-1]; let bi=0,bd=Infinity;
          rest.forEach((s,i)=>{const dd=Math.hypot(s.x-last.x,s.y-last.y);if(dd<bd){bd=dd;bi=i;}}); order.push(rest.splice(bi,1)[0]); }
        const after = order.map(s=>s.name);
        TripStore.reorderStops(order.map(s=>s.id),{source:'ai'});
        typeText(body, `Done. New order: ${after.join(' → ')}. This trims the longest transfer and keeps your nights-per-stop intact.`, () => {
          changeCard(body, { title:'Itinerary reordered', href:'planner.html',
            diff:[{t:'mod',text:`Was: ${before.join(' → ')}`},{t:'mod',text:`Now: ${after.join(' → ')}`}] });
          suggestion(body, 'Open the day planner to see the new route', 'planner.html');
          finish();
        });
      });
    });
  }

  function runAdd(dest, body) {
    typeText(body, `Good call — ${dest.name} fits your ${TripStore.get().style.toLowerCase()} style. Let me check it and add it.`, () => {
      toolCall(body, 'search_destinations', `{ q: "${dest.name}" }`, () => {
        toolCall(body, 'add_stop', `{ name: "${dest.name}", nights: ${parseInt(dest.duration)||2} }`, () => {
          const exists = TripStore.get().stops.some(s=>s.name===dest.name);
          if (!exists) TripStore.addStop({ name:dest.name, location:dest.region, nights:parseInt(dest.duration)||2,
            costTier:dest.tier, x:dest.x, y:dest.y, status:'suggested', activities:dest.highlights.slice(0,3) }, {source:'ai'});
          typeText(body, exists ? `${dest.name} is already in your trip, so I left it as-is.` :
            `Added ${dest.name} as a suggested stop (${parseInt(dest.duration)||2} nights). Your totals updated — check the dashboard, the figure pulses when state changes.`, () => {
            if (!exists) changeCard(body, { title:'Stop added', href:'planner.html',
              diff:[{t:'add',text:`${dest.name} · ${parseInt(dest.duration)||2} nights · suggested`},
                    {t:'mod',text:`Trip now has ${TripStore.derived().stopCount} stops`}] });
            finish();
          });
        });
      });
    });
  }

  function runSearch(q, body) {
    typeText(body, 'Searching destinations that match your trip context…', () => {
      toolCall(body, 'search_destinations', `{ q: "${q.slice(0,32)}" }`, () => {
        const tr = TripStore.get();
        const res = DESTINATIONS.filter(d=>!tr.stops.some(s=>s.name===d.name)).slice(0,3);
        const wrap = document.createElement('div'); wrap.className='inline-results';
        wrap.innerHTML = res.map(d=>`
          <div class="ir-card">
            <div class="ir-thumb" style="background:linear-gradient(135deg,hsl(${d.x*360} 70% 20%),hsl(${d.x*360+40} 75% 9%))"></div>
            <div class="grow"><b>${d.name}</b><div class="muted" style="font-size:12px">${d.region} · ${d.duration}</div></div>
            <button class="btn primary sm ir-add" data-id="${d.id}">${icon('plus',13)}</button>
          </div>`).join('');
        body.appendChild(wrap); scrollDown();
        wrap.querySelectorAll('.ir-add').forEach(b=>b.onclick=()=>{
          const d=DESTINATIONS.find(x=>x.id===b.dataset.id);
          TripStore.addStop({name:d.name,location:d.region,nights:parseInt(d.duration)||2,costTier:d.tier,x:d.x,y:d.y,status:'suggested',activities:d.highlights.slice(0,3)},{source:'ai'});
          b.outerHTML = `<span class="pill green sm">${icon('check',12)} ADDED</span>`;
          toast({title:'Stop added',msg:`${d.name} added by co-pilot.`});
        });
        typeText(body, `Found ${res.length} strong matches near your route. Tap + to add any to your itinerary — it goes straight into shared trip state.`, finish);
      });
    });
  }

  function runBudget(body) {
    typeText(body, 'Estimating your current spend and looking for trims that keep the highlights…', () => {
      toolCall(body, 'estimate_cost', '{ breakdown: true }', () => {
        const d = TripStore.derived(); const tr = TripStore.get();
        const pricey = tr.stops.slice().sort((a,b)=>b.costTier-a.costTier)[0];
        typeText(body, `You're at ~$${d.estCost.toLocaleString()} for ${d.travelerCount} travelers over ${d.totalDays} days. The biggest lever is ${pricey?pricey.name:'your longest stop'} (tier ${pricey?pricey.costTier:'—'}). Dropping one night there or shifting to a tier-2 stay saves roughly 12–18% without losing a marquee experience.`, () => {
          changeCard(body, { title:'Cost analysis', href:'review.html',
            diff:[{t:'mod',text:`Estimate: $${d.estCost.toLocaleString()} (${d.travelerCount} pax)`},
                  {t:'mod',text:`Suggested trim: −1 night @ ${pricey?pricey.name:'top stop'} ≈ −$${Math.round(d.estCost*0.14).toLocaleString()}`}] });
          suggestion(body, 'Open Review to see the full budget breakdown', 'review.html');
          finish();
        });
      });
    });
  }

  function runAbout(dest, body) {
    typeText(body, `${dest.name} — ${dest.summary} Best season is ${dest.season}, and ${dest.duration} is the sweet spot.`, () => {
      toolCall(body, 'validate_trip', `{ check: "fit", dest: "${dest.name}" }`, () => {
        const inTrip = TripStore.get().stops.some(s=>s.name===dest.name);
        typeText(body, inTrip ? `It's already in your trip. Highlights to lock in: ${dest.highlights.slice(0,3).join(', ')}.`
          : `It fits your window with room to spare. Want me to add it? Just say "add ${dest.name}".`, finish);
      });
    });
  }

  async function runFallback(q, body) {
    typeText(body, 'Thinking…', async () => {
      body.querySelector('.ai-text:last-child').remove();
      if (window.claude && window.claude.complete) {
        toolCall(body, 'reason', '{ model: live }', async () => {
          try {
            const tr = TripStore.get(), d = TripStore.derived();
            const sys = `You are the Agentic Travel Co-Pilot assistant for a trip called "${tr.name}". Current trip: ${d.totalDays} days, ${d.stopCount} stops (${tr.stops.map(s=>s.name).join(', ')}), ${d.travelerCount} travelers, est cost $${d.estCost}. Answer concisely (2-4 sentences), be technical and helpful about planning. If the user wants to add/reorder/search, tell them the exact phrase to use (e.g. "add Osaka", "optimize my stop sequence", "find a day-trip near Kyoto").`;
            const reply = await window.claude.complete({ messages:[{role:'user',content: sys+'\n\nUser: '+q}] });
            typeText(body, (reply||'').trim() || "I can search destinations, add or reorder stops, and estimate cost — try one of those.", finish);
          } catch (e) {
            typeText(body, "I hit a limit reaching the model. I can still run tools — try \"optimize my sequence\", \"add Osaka\", or \"where can I trim the budget?\".", finish);
          }
        });
      } else {
        typeText(body, "I can search destinations, add or reorder stops, and estimate cost. Try \"optimize my stop sequence\", \"add Osaka after Kyoto\", or \"find a day-trip near Kyoto\".", finish);
      }
    });
  }

  function finish(){ busy = false; input.disabled = false; document.getElementById('send').disabled = false; }

  function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; input.disabled = true; document.getElementById('send').disabled = true;
    addUser(text); input.value=''; input.style.height='auto';
    const body = addAI();
    const intent = matchIntent(text);
    setTimeout(()=>run(intent, body), 320);
  }

  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });

  // greeting
  (function greet(){
    const body = addAI();
    const tr = TripStore.get(), d = TripStore.derived();
    typeText(body, `Hey — I'm your travel co-pilot. I'm looking at "${tr.name}": ${d.totalDays} days, ${d.stopCount} stops, ${d.travelerCount} travelers. I operate the same controls you do — I can search, add, reorder, and cost your trip. What should we do?`, ()=>{});
  })();

  renderSuggest();
  renderAside();
  TripStore.subscribe(()=>renderAside());

  // deep-link prompt from other pages
  const qp = new URLSearchParams(location.search).get('q');
  if (qp) { input.value = qp; setTimeout(send, 600); }
})();
</script>
<style>
.copilot-main { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.chat-scroll { flex: 1; overflow-y: auto; padding: 26px 30px; display: flex; flex-direction: column; gap: 20px; }
.msg { display: flex; gap: 12px; max-width: 760px; }
.msg.user { align-self: flex-end; flex-direction: row; }
.msg-av { width: 34px; height: 34px; flex: none; clip-path: var(--clip-notch); display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.ai-av { background: linear-gradient(135deg, var(--accent), var(--cyber-accent)); color: var(--cyber-black); }
.user-av { background: linear-gradient(135deg, var(--cyber-secondary), var(--cyber-accent)); color: #fff; }
.bubble { background: var(--cyber-card); border: 1px solid var(--border-subtle); padding: 13px 17px;
  clip-path: var(--clip-notch); font-size: 14.5px; line-height: 1.5; }
.msg.user .bubble { background: rgba(var(--accent-rgb),.1); border-color: var(--accent); }
.ai-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
.ai-text { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--fg); }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); margin-left: 2px;
  vertical-align: text-bottom; animation: blink 1s step-end infinite; }
.tool-call { background: var(--cyber-dark); border: 1px solid var(--border); border-left: 3px solid var(--fg-dim);
  padding: 10px 14px; clip-path: var(--clip-notch); transition: all var(--dur-base); }
.tool-call.running { border-left-color: var(--cyber-warning); }
.tool-call.done { border-left-color: var(--cyber-success); }
.tc-head { display: flex; align-items: center; gap: 10px; }
.tc-spin { color: var(--cyber-warning); display: grid; place-items: center; }
.tool-call.running .tc-spin { animation: spin 1s linear infinite; }
.tool-call.done .tc-spin { color: var(--cyber-success); animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.tc-name { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
.tc-args { font-size: 11px; color: var(--fg-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-state { font-size: 9px; letter-spacing: .14em; color: var(--fg-dim); }
.tool-call.done .tc-state { color: var(--cyber-success); }
.change-card { background: var(--cyber-card); border: 1px solid var(--border-subtle); clip-path: var(--clip-card); padding: 16px;
  box-shadow: 0 0 18px rgba(var(--accent-rgb),.1); }
.cc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cc-diff { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 12px; }
.diff-row { display: flex; gap: 8px; padding: 6px 10px; background: var(--cyber-dark); border-left: 2px solid var(--border); }
.diff-row.add { border-left-color: var(--cyber-success); color: var(--cyber-success); }
.diff-row.rm { border-left-color: var(--cyber-danger); color: var(--cyber-danger); }
.diff-row.mod { border-left-color: var(--accent); color: var(--fg-dim); }
.cc-actions { display: flex; gap: 9px; }
.next-suggest { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); }
.next-suggest svg { flex: none; }
.next-suggest a:hover { text-decoration: underline; }
.inline-results { display: flex; flex-direction: column; gap: 8px; }
.ir-card { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--cyber-dark); border: 1px solid var(--border); }
.ir-thumb { width: 42px; height: 42px; flex: none; clip-path: var(--clip-notch); border: 1px solid var(--border); }
.ir-card b { font-size: 14.5px; }
.pill.sm { padding: 4px 9px; }
/* composer */
.composer { flex: none; border-top: 1px solid var(--border); padding: 14px 30px 16px; background: rgba(10,10,15,.5); }
:root.light .composer { background: rgba(255,255,255,.5); }
.suggest-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.suggest-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px;
  font-weight: 700; letter-spacing: .06em; padding: 7px 12px; background: var(--cyber-dark); border: 1px solid var(--border);
  color: var(--fg-dim); cursor: pointer; clip-path: var(--clip-pill); transition: all var(--dur-base); }
.suggest-chip:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.18); }
.suggest-chip svg { color: var(--accent); }
.composer-box { display: flex; align-items: flex-end; gap: 10px; background: var(--cyber-dark); border: 1px solid var(--border);
  padding: 8px 8px 8px 16px; clip-path: var(--clip-notch); transition: all var(--dur-base); }
.composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 16px rgba(var(--accent-rgb),.2); }
.composer-box textarea { flex: 1; background: none; border: none; outline: none; resize: none; color: var(--fg);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.5; max-height: 120px; padding: 6px 0; }
.send-btn { padding: 11px 16px; flex: none; }
.composer-foot { display: flex; justify-content: space-between; margin-top: 9px; font-size: 9.5px; letter-spacing: .12em; color: var(--fg-dim); }
.composer-foot .status-dot { margin-right: 5px; }
/* aside */
.activity-log { display: flex; flex-direction: column; gap: 5px; }
.act-row { display: flex; align-items: center; gap: 9px; padding: 8px 11px; background: var(--cyber-dark); border: 1px solid var(--border); border-left: 2px solid var(--border); }
.act-row.running { border-left-color: var(--cyber-warning); }
.act-row.done { border-left-color: var(--cyber-success); }
.act-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-dim); flex: none; }
.act-row.running .act-dot { background: var(--cyber-warning); animation: pulse-glow 1s infinite; }
.act-row.done .act-dot { background: var(--cyber-success); }
.act-name { font-size: 11.5px; color: var(--fg); flex: 1; }
.act-st { font-size: 10px; color: var(--cyber-success); display: flex; }
.act-row.running .act-st { color: var(--cyber-warning); }
.ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.ss-cell { display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; background: var(--cyber-dark); border: 1px solid var(--border); }
.ss-cell b { font-size: 19px; font-family: var(--font-display); }
.ss-stop { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 7px 11px; background: var(--cyber-dark); border: 1px solid var(--border); }
.ss-note { display: flex; align-items: flex-start; gap: 7px; font-size: 10px; letter-spacing: .04em; color: var(--fg-dim);
  margin-top: 16px; padding: 11px; background: rgba(var(--accent-rgb),.05); border: 1px solid var(--border-subtle); line-height: 1.5; }
.ss-note svg { flex: none; margin-top: 1px; color: var(--accent); }
</style>
</body>
</html>
